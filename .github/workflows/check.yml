name: Checks and measured smoke cases
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.lock
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_CHANNEL: chromium
      - name: Reproduce observed outcomes (not a converter accuracy pass)
        run: python -m scripts.run_converters --output artifacts/live --expect-observed
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: measured-smoke-evidence
          path: artifacts/
          if-no-files-found: error
